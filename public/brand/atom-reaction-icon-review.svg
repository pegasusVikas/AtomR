<svg width="1200" height="760" viewBox="0 0 1200 760" fill="none" xmlns="http://www.w3.org/2000/svg">
  <title>Atom Reaction icon review</title>
  <defs>
    <linearGradient id="bg" x1="140" y1="80" x2="1010" y2="660" gradientUnits="userSpaceOnUse">
      <stop stop-color="#10141C"/>
      <stop offset="1" stop-color="#090B11"/>
    </linearGradient>
    <linearGradient id="panel" x1="170" y1="140" x2="1020" y2="610" gradientUnits="userSpaceOnUse">
      <stop stop-color="#151A25"/>
      <stop offset="1" stop-color="#0D1017"/>
    </linearGradient>
    <linearGradient id="frame" x1="10" y1="8" x2="54" y2="56" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1C2634"/>
      <stop offset="1" stop-color="#0B1017"/>
    </linearGradient>
    <linearGradient id="burst" x1="21" y1="18" x2="44" y2="42" gradientUnits="userSpaceOnUse">
      <stop stop-color="#35D6E7"/>
      <stop offset="1" stop-color="#FF6B3D"/>
    </linearGradient>
    <linearGradient id="core" x1="26" y1="24" x2="38" y2="38" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F8FBFF"/>
      <stop offset="1" stop-color="#CDD7EA"/>
    </linearGradient>
    <g id="mark">
      <rect x="8" y="8" width="48" height="48" rx="16" fill="url(#frame)"/>
      <path d="M32 14L36 22H28L32 14Z" fill="#35D6E7"/>
      <path d="M50 32L42 36V28L50 32Z" fill="#FF6B3D"/>
      <path d="M32 50L28 42H36L32 50Z" fill="#35D6E7"/>
      <path d="M14 32L22 28V36L14 32Z" fill="#FF6B3D"/>
      <path
        d="M32 20L44 32L32 44L20 32L32 20Z"
        fill="url(#burst)"
        fill-opacity="0.18"
        stroke="url(#burst)"
        stroke-width="2.6"
      />
      <circle cx="32" cy="32" r="6.2" fill="url(#core)"/>
      <circle cx="32" cy="32" r="10" fill="none" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="1.2"/>
      <circle cx="24" cy="24" r="2.2" fill="#35D6E7"/>
      <circle cx="40" cy="24" r="2.2" fill="#FF6B3D"/>
      <circle cx="24" cy="40" r="2.2" fill="#FF6B3D"/>
      <circle cx="40" cy="40" r="2.2" fill="#35D6E7"/>
    </g>
  </defs>

  <rect width="1200" height="760" fill="#080A10"/>
  <rect x="72" y="72" width="1056" height="616" rx="42" fill="url(#bg)"/>
  <rect x="108" y="108" width="984" height="544" rx="34" fill="url(#panel)" stroke="#FFFFFF" stroke-opacity="0.06"/>

  <text x="154" y="168" fill="#FFFFFF" fill-opacity="0.92" font-size="42" font-family="Oxanium, Segoe UI, sans-serif" font-weight="700" letter-spacing="-1.5">
