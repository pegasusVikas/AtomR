  </g>
  <text x="154" y="514" fill="#FFFFFF" fill-opacity="0.72" font-size="22" font-family="Oxanium, Segoe UI, sans-serif" font-weight="600">
    App tile / favicon base
  </text>

  <rect x="420" y="258" width="240" height="220" rx="32" fill="#0B1017" stroke="#FFFFFF" stroke-opacity="0.06"/>
  <text x="450" y="312" fill="#FFFFFF" fill-opacity="0.42" font-size="16" font-family="Oxanium, Segoe UI, sans-serif" letter-spacing="2">
    16 / 24 / 32 / 64
  </text>
  <g transform="translate(462 352) scale(0.9)">
    <use href="#mark"/>
  </g>
  <g transform="translate(520 344) scale(1.35)">
    <use href="#mark"/>
  </g>
  <g transform="translate(591 334) scale(1.75)">
    <use href="#mark"/>
  </g>
  <g transform="translate(474 405) scale(2.65)">
    <use href="#mark"/>
  </g>

  <rect x="706" y="258" width="328" height="220" rx="32" fill="#0B1017" stroke="#FFFFFF" stroke-opacity="0.06"/>
  <g transform="translate(734 286) scale(1.55)">
    <use href="#mark"/>
  </g>
  <text x="830" y="344" fill="#FFFFFF" fill-opacity="0.92" font-size="28" font-family="Oxanium, Segoe UI, sans-serif" font-weight="700" letter-spacing="0.8">
