  </text>

  <rect x="154" y="530" width="880" height="78" rx="24" fill="#0A0D13" stroke="#FFFFFF" stroke-opacity="0.05"/>
  <g transform="translate(180 542) scale(0.9)">
    <use href="#mark"/>
  </g>
  <text x="252" y="578" fill="#FFFFFF" fill-opacity="0.88" font-size="30" font-family="Oxanium, Segoe UI, sans-serif" font-weight="700" letter-spacing="0.6">
